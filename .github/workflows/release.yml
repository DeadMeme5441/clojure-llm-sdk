name: Release

# Publish to Clojars when a v* tag is pushed. The tag IS the release trigger:
#   git tag v0.1.0 && git push origin v0.1.0
# The version is derived from the tag (minus the leading `v`) and threaded into
# the build via RELEASE_VERSION, so the tag, jar name, and pom never drift.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and deploy to Clojars
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clojure-release-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clojure-release-${{ runner.os }}-

      - name: Derive version from tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing version $V"

      - name: Run tests
        run: clojure -M:test

      - name: Build jar
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: clojure -T:build jar

      - name: Deploy to Clojars
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: |
          clojure -X:deploy \
            :artifact "\"target/clojure-llm-sdk-${{ steps.ver.outputs.version }}.jar\""
