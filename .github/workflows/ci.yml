name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, and build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
          clj-kondo: latest

      - name: Cache Clojure dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            .cpcache
          key: clojure-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            clojure-${{ runner.os }}-

      - name: Lint
        run: clj-kondo --lint src test

      - name: Unit tests
        run: clojure -M:test

      - name: Snapshot generator tests
        run: python3 -m unittest discover -s test -p '*_test.py'

      - name: Build jar
        run: clojure -T:build jar
